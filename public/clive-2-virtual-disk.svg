  <rect x="910" y="596" width="20" height="82" fill="#F5B46F"/>
 </g>
 <text x="91" y="646" fill="#09182C" font-size="27" font-weight="800">Main APFS · 262.5 GB</text>
 <text x="661" y="717" fill="#B4C8E6" font-size="20">Recovery · 5.4 GB</text>
 <path d="M918 684v15h-25" fill="none" stroke="#F5B46F" stroke-width="2"/>
 <text x="71" y="714" fill="#B4C8E6" font-size="20">ISC · 524 MB</text>
 <rect x="70" y="761" width="860" height="148" rx="24" fill="#152A3C" stroke="#447B75" stroke-width="2"/>
 <text x="105" y="803" fill="#B6D7DF" font-size="23" font-weight="700">GUEST AVAILABLE STORAGE</text>
